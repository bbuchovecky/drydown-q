[workspace]
name = "drydown-q"
description = "Readable rewrite of the Morgan et al. (2025) soil moisture drydown analysis"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26"
pandas = ">=2.2"
scipy = ">=1.12"
xarray = ">=2024.1"
netcdf4 = ">=1.6"
pyarrow = ">=15"
matplotlib = ">=3.8"
pyyaml = ">=6"
joblib = ">=1.3"
pytest = ">=8"
# Transitive dependency of `ismn`, taken from conda-forge because the PyPI
# source build needs a system PROJ.
pyproj = ">=3.6"

[pypi-dependencies]
# `ismn` (the ISMN archive reader) is not on conda-forge, so it comes from PyPI.
ismn = ">=1.5"
drydown-q = { path = ".", editable = true }

[tasks]
test = "pytest"
smoke = { cmd = "pytest -q -m 'not recovery' && python scripts/analyze.py --run smoke --paths config/paths.smoke.yml" }
prepare = "python scripts/prepare.py"
analyze = { cmd = "python scripts/analyze.py --run {{ run }}", args = [{ arg = "run", default = "morgan2025" }] }
reproduce = "python scripts/reproduce.py --refit-sample 4000"
sweep = { cmd = "python scripts/sweep.py --sweep {{ sweep }}", args = [{ arg = "sweep", default = "thresholds" }] }
make-smoke-data = "python tests/make_smoke_data.py"
